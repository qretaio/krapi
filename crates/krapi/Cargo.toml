[package]
name = "krapi"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "the kube resource orchestrator engine: ResourceGraphDefinitions compiled to dependency graphs, instances reconciled over any list/watch/apply face"

[lib]
name = "krapi"
path = "src/lib.rs"

[features]
default = ["controller"]
# Tier 1: RGD types, SimpleSchema, typed resource builders — no engine.
types = []
# Tier 2: + compile/CRD synthesis (CEL, graph, CRD). Includes `types`.
engine = ["types", "dep:cel", "dep:regex", "dep:url", "dep:k8s-openapi", "dep:sha2", "dep:md-5", "dep:jiff", "dep:tracing", "dep:tokio", "dep:kube-core"]
# Tier 3: + reconciliation + list/watch/apply faces. Includes `engine`.
controller = ["engine", "dep:tokio", "dep:kube-core"]

[dependencies]
kapi-ext = { path = "../../../kapi-ext" }
serde = { workspace = true }
serde_json = { workspace = true }
# The engine tier needs CEL evaluation + the k8s CEL extension libraries.
cel = { workspace = true, optional = true }
regex = { version = "1", optional = true }
url = { workspace = true, optional = true }
# The controller tier rides the shared watch-event envelope.
kube-core = { workspace = true, optional = true }
# One API-version pin across the graph (the kapi convention).
k8s-openapi = { workspace = true, features = ["v1_33"], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
thiserror = { workspace = true }
sha2 = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }

[dev-dependencies]
serde_yaml = { workspace = true }

# kro's own lint posture (kept across the workspace merge): the engine's
# code uses crate-qualified paths and opaque small markers by design.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
mod_module_files = "deny"
